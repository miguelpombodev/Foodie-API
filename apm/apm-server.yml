######################### APM Server Configuration #########################

################################ APM Server ################################

apm-server:
  host: "0.0.0.0:8200"

  secret_token: "new-secret-token"
  
  rum:
    enabled: true

    allow_origins: ['*']
    library_pattern: "node_modules|bower_components|~"

    exclude_from_grouping: "^/webpack"

    source_mapping:
      enabled: true
      elasticsearch:
        hosts: ["http://foodie_elastic:9200"]
        username: "elastic"
        password: "changeme"
        expiration: 5m
      index_pattern: "apm-*-sourcemap"

  kibana:
    enabled: true
    host: "http://foodie_kibana:5601"
    username: "elastic"
    password: "changeme"

output.elasticsearch:
  hosts: ["http://foodie_elastic:9200"]